name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 목록 페이지는 lessons/ · reference/ 의 문서에서 생성한다.
      # 새 레슨을 추가하고 푸시하면 목록에 자동으로 들어온다 —
      # 커밋된 index.html 이 낡아 있어도 배포본은 항상 최신이다.
      - name: 목록 페이지 생성
        run: python3 tools/build-index.py

      # 사이트에 올릴 것은 레슨·참조 문서(HTML)와 그 에셋, 목록 페이지뿐이다.
      # 마크다운 문서(MISSION·NOTES·RESOURCES·GLOSSARY)와 learning-records/ 는
      # 웹에 노출하지 않는다 — 저장소에서 GitHub 렌더링으로 읽는다.
      # tools/ 와 workspace.json 은 빌드 입력이라 배포하지 않는다.
      - name: 배포할 파일만 모은다
        run: |
          mkdir -p _site
          tar -cf - \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./_site \
            --exclude=./.gitignore \
            --exclude='*.md' \
            --exclude=learning-records \
            --exclude=./tools \
            --exclude='workspace.json' \
            . | tar -xf - -C _site
          echo "---- 배포 대상 ----"
          find _site -type f | sort

      # Jekyll 빌드 없이 정적 파일 그대로 (_site/.nojekyll 참조)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
